name: Sign and publish frozen vocabulary

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated frozen candidate as an immutable release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: vocabulary-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate exact frozen V4 candidate
        run: |
          python verify_release_candidate.py \
            --candidate-dir release-candidates/v4 \
            --version 4 \
            --content-sha256 ce531d2112e8ed6f4a6fefc4e680c4a73fc72b51cfad2cd317c50f08c8b9e31d \
            --artifact-sha256 c7f489d19846837ed3a443ba05a5c63ee9ebbb3e970fc322c3786f68b2892603 \
            --terms 25008 \
            --aliases 2079
      - name: Sign exact frozen manifest
        env:
          VOCABULARY_SIGNING_KEY: ${{ secrets.VOCABULARY_SIGNING_KEY }}
        run: python sign_manifest.py --candidate-dir release-candidates/v4
      - name: Verify production signature and hashes
        run: |
          python verify_release_candidate.py \
            --candidate-dir release-candidates/v4 \
            --version 4 \
            --content-sha256 ce531d2112e8ed6f4a6fefc4e680c4a73fc72b51cfad2cd317c50f08c8b9e31d \
            --artifact-sha256 c7f489d19846837ed3a443ba05a5c63ee9ebbb3e970fc322c3786f68b2892603 \
            --terms 25008 \
            --aliases 2079 \
            --signature release-candidates/v4/manifest.sig
      - name: Preserve signed dry-run evidence
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: signed-v4-dry-run
          if-no-files-found: error
          retention-days: 7
          path: |
            release-candidates/v4/manifest.json
            release-candidates/v4/manifest.sig
            release-candidates/v4/global-v4.json.gz
      - name: Publish immutable V4 release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v4 \
            release-candidates/v4/manifest.json \
            release-candidates/v4/manifest.sig \
            release-candidates/v4/global-v4.json.gz \
            --title "Vocabulary v4" \
            --notes "Accepted deterministic FlowKit global vocabulary V4."
